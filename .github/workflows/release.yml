name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本（格式：v1.2.3）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.23.0
  NODE_VERSION: 22
  WAILS_VERSION: v2.10.2
  NFPM_VERSION: v2.41.3

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release version must match v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "manual releases must run from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi
          existing_commit="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
          if [[ -n "$existing_commit" && "$existing_commit" != "$GITHUB_SHA" ]]; then
            echo "release tag $RELEASE_TAG already points to a different commit" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows/amd64
            os: windows
            arch: amd64
            runner: windows-latest
          - target: windows/arm64
            os: windows
            arch: arm64
            runner: windows-11-arm
          - target: linux/amd64
            os: linux
            arch: amd64
            runner: ubuntu-24.04
          - target: linux/arm64
            os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - target: darwin/amd64
            os: darwin
            arch: amd64
            runner: macos-15-intel
          - target: darwin/arm64
            os: darwin
            arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate semantic version tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match v<major>.<minor>.<patch>" >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}
      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Build release binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version="$RELEASE_TAG"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/cf-optimizer/cf-optimizer/internal/version.Version=${version} -X github.com/cf-optimizer/cf-optimizer/internal/version.Commit=${GITHUB_SHA} -X github.com/cf-optimizer/cf-optimizer/internal/version.Date=${build_date}"
          suffix=""
          if [[ "$TARGET_OS" == windows ]]; then suffix=".exe"; fi
          args=(build -clean -trimpath -platform "$TARGET" -ldflags "$ldflags" -o "cf-optimizer-ui${suffix}")
          if [[ "$TARGET_OS" == linux ]]; then args+=(-tags webkit2_41); fi
          (cd cmd/desktop && wails "${args[@]}")

          stage="dist/stage-${TARGET_OS}-${TARGET_ARCH}"
          mkdir -p "$stage" dist/release
          CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -ldflags "$ldflags" -o "$stage/cf-optimizer$suffix" ./cmd/cli
          CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -ldflags "$ldflags" -o "$stage/cf-optimizerd$suffix" ./cmd/daemon
          if [[ "$TARGET_OS" != darwin ]]; then
            cp "packaging/wails/bin/cf-optimizer-ui$suffix" "$stage/cf-optimizer-ui$suffix"
          fi
      - name: Sign Windows binaries when credentials are configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "Windows signing credentials are not configured; producing unsigned binaries."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required when a certificate is configured."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'cf-optimizer-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $certificate) { throw 'Unable to import the Windows signing certificate.' }
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $toolArch = if ($env:TARGET_ARCH -eq 'arm64') { 'arm64' } else { 'x64' }
          $signTool = Get-ChildItem $kitRoot -Filter signtool.exe -Recurse |
            Where-Object { $_.Directory.Name -eq $toolArch } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw "signtool.exe for $toolArch was not found." }
          Get-ChildItem "dist/stage-windows-$env:TARGET_ARCH" -Filter *.exe | ForEach-Object {
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $certificate.Thumbprint $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($_.Name)." }
          }
          "WINDOWS_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import macOS signing credentials when configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_APP_SIGN_IDENTITY_SECRET: ${{ secrets.MACOS_APP_SIGN_IDENTITY }}
          MACOS_INSTALLER_SIGN_IDENTITY_SECRET: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID_SECRET: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_SECRET: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          if [[ -n "$MACOS_CERTIFICATE_BASE64" ]]; then
            if [[ -z "$MACOS_CERTIFICATE_PASSWORD" || -z "$MACOS_APP_SIGN_IDENTITY_SECRET" || -z "$MACOS_INSTALLER_SIGN_IDENTITY_SECRET" ]]; then
              echo "macOS certificate password and both signing identities are required." >&2
              exit 1
            fi
            certificate_path="$RUNNER_TEMP/cf-optimizer-signing.p12"
            keychain_path="$RUNNER_TEMP/cf-optimizer-signing.keychain-db"
            keychain_password="$(uuidgen)"
            printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
            security create-keychain -p "$keychain_password" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"
            security unlock-keychain -p "$keychain_password" "$keychain_path"
            security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
            security list-keychains -d user -s "$keychain_path" login.keychain-db
            security default-keychain -s "$keychain_path"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
            printf 'MACOS_APP_SIGN_IDENTITY=%s\n' "$MACOS_APP_SIGN_IDENTITY_SECRET" >> "$GITHUB_ENV"
            printf 'MACOS_INSTALLER_SIGN_IDENTITY=%s\n' "$MACOS_INSTALLER_SIGN_IDENTITY_SECRET" >> "$GITHUB_ENV"
          else
            echo "macOS signing credentials are not configured; producing unsigned packages."
          fi
          if [[ -n "$MACOS_NOTARY_KEY_BASE64" ]]; then
            if [[ -z "$MACOS_CERTIFICATE_BASE64" ]]; then
              echo "macOS signing credentials are required before notarization." >&2
              exit 1
            fi
            if [[ -z "$MACOS_NOTARY_KEY_ID_SECRET" || -z "$MACOS_NOTARY_ISSUER_SECRET" ]]; then
              echo "macOS notary key ID and issuer are required with the notary key." >&2
              exit 1
            fi
            notary_key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$MACOS_NOTARY_KEY_BASE64" | base64 -D > "$notary_key"
            printf 'MACOS_NOTARY_KEY=%s\n' "$notary_key" >> "$GITHUB_ENV"
            printf 'MACOS_NOTARY_KEY_ID=%s\n' "$MACOS_NOTARY_KEY_ID_SECRET" >> "$GITHUB_ENV"
            printf 'MACOS_NOTARY_ISSUER=%s\n' "$MACOS_NOTARY_ISSUER_SECRET" >> "$GITHUB_ENV"
          fi
      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $stage = (Resolve-Path "dist/stage-windows-$env:TARGET_ARCH").Path
          $output = (Resolve-Path "dist/release").Path
          $webviewInstaller = Join-Path $stage "MicrosoftEdgeWebview2Setup.exe"
          curl.exe -fsSL "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -o $webviewInstaller
          if ($LASTEXITCODE -ne 0) {
            throw "WebView2 installer download failed with exit code $LASTEXITCODE."
          }

          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DMyVersion=$version" `
            "/DMyArch=$env:TARGET_ARCH" `
            "/DSourceDir=$stage" `
            "/DOutputDir=$output" `
            "packaging\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }
      - name: Sign Windows installer when credentials are configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_THUMBPRINT)) { exit 0 }
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $toolArch = if ($env:TARGET_ARCH -eq 'arm64') { 'arm64' } else { 'x64' }
          $signTool = Get-ChildItem $kitRoot -Filter signtool.exe -Recurse |
            Where-Object { $_.Directory.Name -eq $toolArch } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw "signtool.exe for $toolArch was not found." }
          Get-ChildItem dist/release -Filter *.exe | ForEach-Object {
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $env:WINDOWS_SIGNING_THUMBPRINT $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($_.Name)." }
          }
      - name: Create Linux installer bundle
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: packaging/linux/package.sh "$RELEASE_TAG" "$TARGET_ARCH" "dist/stage-linux-${TARGET_ARCH}" dist/release
      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          packaging/macos/package.sh "$RELEASE_TAG" "$TARGET_ARCH" \
            "dist/stage-darwin-${TARGET_ARCH}" "packaging/wails/bin/CF Optimizer.app" dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Checksums and GitHub release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Validate six platform installers
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: bash packaging/verify-release-assets.sh "$RELEASE_TAG" release
      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          generated_notes="$RUNNER_TEMP/generated-notes.md"
          release_notes="$RUNNER_TEMP/release-notes.md"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" --jq .body > "$generated_notes"
          {
            bash packaging/release-downloads.sh "$RELEASE_TAG" "$GITHUB_REPOSITORY"
            printf '\n---\n\n'
            cat "$generated_notes"
          } > "$release_notes"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mapfile -t published_assets < <(
              gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name'
            )
            for asset_name in "${published_assets[@]}"; do
              if [[ ! -f "release/$asset_name" ]]; then
                gh release delete-asset "$RELEASE_TAG" "$asset_name" --yes --repo "$GITHUB_REPOSITORY"
              fi
            done
            gh release upload "$RELEASE_TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --notes-file "$release_notes" --repo "$GITHUB_REPOSITORY"
          else
            create_args=(--notes-file "$release_notes" --title "CF Optimizer $RELEASE_TAG" --repo "$GITHUB_REPOSITORY")
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              create_args+=(--target "$GITHUB_SHA")
            else
              create_args+=(--verify-tag)
            fi
            gh release create "$RELEASE_TAG" release/* "${create_args[@]}"
          fi

          local_assets="$(find release -maxdepth 1 -type f -printf '%f\n' | sort)"
          remote_assets="$(
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | sort
          )"
          if [[ "$remote_assets" != "$local_assets" ]]; then
            echo "published release assets do not match the verified local set" >&2
            diff -u <(printf '%s\n' "$local_assets") <(printf '%s\n' "$remote_assets") || true
            exit 1
          fi
